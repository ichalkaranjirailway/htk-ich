<footer id="footer">
<div class="wrap">
<div><strong>इचलकरंजी रेल्वे कृती समिती</strong></div>

</div>

<script src="evidence-data.js"></script>
<script>
function esc(s){ return (s || '').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderFilePreview(d){
  if (!d.originalFile) return '<div class="ev-file-box">मूळ फाईल उपलब्ध नाही.</div>';
  const url = d.originalFile;
  const box = /\.pdf$/i.test(url) ? `<iframe src="${url}"></iframe>` : `<img src="${url}">`;
  return `<div class="ev-file-box">${box}</div><a class="ev-original-link" href="${url}" target="_blank" rel="noopener">📄 मूळ कागदपत्र पाहा / Download</a>`;
}

function render(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const root = document.getElementById('evDetailRoot');
  const docs = (typeof EVIDENCE_DOCS !== 'undefined' ? EVIDENCE_DOCS : []);
  const d = docs.find(x => x.id === id && x.status === 'published');

  if (!d) {
    root.innerHTML = `<div class="ev-empty" style="margin-top:40px;">हे कागदपत्र सापडलं नाही — कदाचित लिंक चुकीची आहे किंवा अजून Publish झालेलं नाही.</div>`;
    return;
  }

  document.title = (d.title || 'कागदपत्र') + ' — इचलकरंजी रेल्वे';

  root.innerHTML = `
    <div class="ev-detail-header">
      <h1>${esc(d.title)}</h1>
      <div class="ev-detail-meta">
        <span><b>Category:</b> ${esc(d.category)}</span>
        ${d.date ? `<span><b>दिनांक:</b> ${esc(d.date)}</span>` : ''}
        ${d.authority ? `<span><b>विभाग:</b> ${esc(d.authority)}</span>` : ''}
        ${d.referenceNumber ? `<span><b>Reference No.:</b> ${esc(d.referenceNumber)}</span>` : ''}
      </div>
    </div>
    <div class="ev-detail-body">
      <div class="ev-original-col">
        ${renderFilePreview(d)}
      </div>
      <div class="ev-content-col">
        ${d.summary ? `<div class="ev-summary-box"><span class="ev-reviewed-tag">Admin-Reviewed</span><br>${esc(d.summary)}</div>` : ''}
        ${d.extractedText ? `<div class="ev-original-toggle" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block';">कागदपत्रातील संपूर्ण मजकूर (OCR) पाहा ▾</div><div class="ev-original-text">${esc(d.extractedText)}</div>` : ''}
        ${d.tags && d.tags.length ? `<div class="ev-tags" style="margin-top:6px;">🏷️ ${d.tags.map(esc).join(', ')}</div>` : ''}
      </div>
    </div>
  `;
}
render();
</script>
